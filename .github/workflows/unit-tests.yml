# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Unit Tests

on:
  push:
    branches: [ "main", "branch-*" ]
  pull_request:
    branches: [ "main", "branch-*" ]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not depend on sparkVersion, run once.
  #
  # Only `spark` and `integrationTests` read sparkVersion (build.sbt), so these
  # modules produce identical results for every Spark version. Running them
  # inside the matrix duplicated ~7 minutes of tests, plus a ~4 minute
  # licenseCheck, on every pull request.
  #
  # This list must stay in sync with root's .aggregate(...) in build.sbt, minus
  # `spark`. A module added there and not added here is silently never tested.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: core

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '17'
        distribution: 'temurin'
        # Caches ~/.sbt, ~/.ivy2/cache and ~/.cache/coursier.
        cache: 'sbt'

    - name: Cache the sbt launcher
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/sbt-launch-*.jar
        key: sbt-launcher-${{ hashFiles('project/build.properties') }}

    - name: Build and verify the local deployment.
      run: build/sbt clean package publishM2

    - name: Run tests with coverage
      run: >
        build/sbt -J-Xmx2G
        +serverModels/jacoco
        +client/jacoco
        +pythonClient/jacoco
        +server/jacoco
        +cli/jacoco
        +controlApi/jacoco
        +controlModels/jacoco
        +apiDocs/jacoco

    # jacoco writes a report per module and nothing consumed them before, so a
    # coverage run produced numbers nobody could read.
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: jacoco-core
        path: '**/jacoco/report/**'
        if-no-files-found: warn
        retention-days: 7

  # Only the Spark-dependent modules are matrixed.
  #
  # The job name is load-bearing: `test (Spark 4.0.0)` and `test (Spark 4.1.0)`
  # are required status checks on main. Renaming them blocks every pull request
  # on checks that never report.
  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    name: test (Spark ${{ matrix.spark-version }})
    strategy:
      # A flake in one leg must not cancel the other leg's results.
      fail-fast: false
      matrix:
        spark-version: ["4.0.0", "4.1.0"]

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '17'
        distribution: 'temurin'
        # Caches ~/.sbt, ~/.ivy2/cache and ~/.cache/coursier.
        cache: 'sbt'

    - name: Cache the sbt launcher
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/sbt-launch-*.jar
        key: sbt-launcher-${{ hashFiles('project/build.properties') }}

      # 'integrationTests' is not in root project, since we avoid running it via `./build/sbt test`,
      # Here, we explicitly compile `integrationTests` to catch compilation issues early.
    - name: Compile integration tests to verify compilation and checkstyle issues.
      run: build/sbt -DsparkVersion=${{ matrix.spark-version }} integrationTests/test:compile

    - name: Run tests with coverage
      run: build/sbt -DsparkVersion=${{ matrix.spark-version }} -J-Xmx2G +spark/jacoco

    # jacoco writes a report per module and nothing consumed them before, so a
    # coverage run produced numbers nobody could read.
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: jacoco-spark-${{ matrix.spark-version }}
        path: '**/jacoco/report/**'
        if-no-files-found: warn
        retention-days: 7
