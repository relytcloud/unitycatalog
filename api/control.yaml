openapi: 3.0.0
servers:
  - url: http://localhost:8080/api/1.0/unity-control
    description: Localhost reference server
tags:
  - name: Users
    description: |
      A user is the identity recognized by Unity Catalog.

paths:
  /scim2/Users:
    post:
      tags:
        - Users
      operationId: createUser
      summary: Create a user
      description: |
        Creates a new user.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserResource'
      responses:
        '200':
          description: The new user was successfully created.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserResource'
    get:
      tags:
        - Users
      parameters:
        - name: filter
          in: query
          description: Query by which the results have to be filtered.
          schema:
            type: string
          required: false
        - name: startIndex
          in: query
          description: Specifies the index of the first result. First item is number 1.
          schema:
            type: integer
            format: int32
          required: false
        - name: count
          in: query
          description: Desired number of results per page. If no count is provided, it defaults to 50.
          schema:
            type: integer
            format: int32
          required: false
      operationId: listUsers
      summary: List users
      description: |
        Gets details for all the users.
      responses:
        '200':
          description: The user list was successfully retrieved.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserResourceList'
  /scim2/Users/{id}:
    parameters:
      - name: id
        in: path
        description: The id of the user.
        required: true
        schema:
          type: string
    get:
      tags:
        - Users
      operationId: getUser
      summary: Get a user
      description: |
        Gets the specified user.
      responses:
        '200':
          description: The user was successfully retrieved.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserResource'
    put:
      tags:
        - Users
      operationId: updateUser
      summary: Update a user
      description: |
        Updates the user that matches the supplied id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserResource'
      responses:
        '200':
          description: The user was successfully updated.
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/UserResource'
    patch:
      tags:
        - Users
      operationId: patchUser
      summary: Patch a user
      description: |
        Applies a SCIM patch to the user that matches the supplied id. Only a `replace` operation
        with no path is supported, whose value sets the user's `active` flag — this is how a user
        is deactivated and reactivated.

        Deactivation takes effect on the next request: the server re-reads the user's state on
        every call, so access tokens already issued stop working immediately. Nothing else about
        the user changes — their grants, the objects they own and their email are left as they
        were, which is what makes it reversible.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRequest'
      responses:
        '200':
          description: The user was successfully patched.
          content:
            application/scim+json:
              schema: {}
        '501':
          description: The patch contained no supported operation.
    delete:
      tags:
        - Users
      operationId: deleteUser
      summary: Deactivate or permanently delete a user
      description: |
        Without `purge`, deactivates the user — the same state change as a SCIM patch setting
        `active` to false, and equally reversible.

        With `purge=true`, removes the user record permanently. This is the only way to free the
        user's email and externalId for reuse; it does not block access any harder than
        deactivation, which already refuses the user on every request. Because it cannot be undone,
        the server requires that:

          * the caller is a metastore administrator, and is not the user being deleted;
          * the user is already deactivated;
          * `confirm_principal` repeats the user's principal exactly;
          * another enabled metastore administrator remains afterwards;
          * the built-in `admin` account is never the target — it is the account behind the
            password sign-in, the way back in when the identity provider is unavailable;
          * `reassign_to` names an enabled user, if the target owns anything.

        Ownership transfers in both places it is recorded: the `owner` field of each object, and
        the OWNER privileges that actually authorize. `created_by` and `updated_by` are left alone —
        they record what happened, which stays true.
      parameters:
        - name: purge
          in: query
          description: |
            Permanently remove the user record instead of deactivating them. Cannot be undone.
          required: false
          schema:
            type: boolean
            default: false
        - name: reassign_to
          in: query
          description: |
            Principal (email) taking ownership of everything the user owns. Required with
            `purge=true` when the user owns anything; must name an enabled user other than the
            target. Prefer the administrator performing the deletion over the built-in `admin`
            account, which may itself be deactivated.
          required: false
          schema:
            type: string
        - name: confirm_principal
          in: query
          description: |
            The target user's principal, repeated back. Required with `purge=true`. The user list
            mixes people with Relyt instance principals, which look alike; this is what catches
            the wrong row being selected.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The user was successfully deactivated or deleted.
          content:
            application/scim+json:
              schema: {}
        '400':
          description: |
            A guard refused the purge — missing or mismatched `confirm_principal`, the user is
            still active, the target is the caller or the built-in administrator, no other enabled
            administrator would remain, or `reassign_to` is unusable.
        '409':
          description: |
            The user owns objects and no `reassign_to` was supplied.
  /scim2/Users/{id}/ownedObjects:
    parameters:
      - name: id
        in: path
        description: The id of the user.
        required: true
        schema:
          type: string
    get:
      tags:
        - Users
      operationId: getUserOwnedObjects
      summary: List what a user owns
      description: |
        Every securable whose owner is this user, so that a caller can see the consequences of
        deleting them before anything happens. One indexed query per securable type, unlike the
        per-object walk needed to enumerate a user's privileges.
      responses:
        '200':
          description: The owned objects were successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedObjectsResponse'
  /scim2/Me:
    get:
      tags:
        - Users
      operationId: getSelf
      summary: Get the current user
      description: |
        Gets the user from the jwt token provided.
      responses:
        '200':
          description: The user was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResource'
  /metastore/admins:
    get:
      tags:
        - Metastore
      operationId: listMetastoreAdmins
      summary: List the metastore's administrators
      description: |
        The users holding OWNER on the metastore, deactivated ones included. This is the only way
        to see that: OWNER is filtered out of `/permissions` responses, so no other endpoint
        reveals who holds it.
      responses:
        '200':
          description: The administrators were successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetastoreAdmins'
  /metastore/admins/{email}:
    parameters:
      - name: email
        in: path
        description: The user's principal.
        required: true
        schema:
          type: string
    put:
      tags:
        - Metastore
      operationId: grantMetastoreAdmin
      summary: Make a user an administrator
      description: |
        Grants the user OWNER on the metastore, which is what being an administrator means: it
        authorizes every securable, including ones they do not personally own.

        Any administrator may do this. Metastore OWNER is the top of the privilege lattice, so an
        administrator granting one has escalated nobody past themselves — whereas restricting it
        to the built-in `admin` account would make the break-glass password sign-in a participant
        in routine administration.

        The user must exist and be active; ownership of a deactivated account authorizes nothing
        and would only obscure who is really in charge.
      responses:
        '200':
          description: The user is now an administrator.
        '400':
          description: The user is deactivated.
        '404':
          description: No such user.
    delete:
      tags:
        - Metastore
      operationId: revokeMetastoreAdmin
      summary: Withdraw a user's administrator privilege
      description: |
        Revoking your own is allowed — handing over is a real thing to want — but only while
        somebody else still holds it. At least one *enabled* administrator must remain: a
        deactivated one cannot sign in, and a metastore left without one has no supported way back,
        because the bootstrap re-grants OWNER only when the `admin` user does not exist at all.
      responses:
        '200':
          description: The user is no longer an administrator.
        '400':
          description: This would leave the metastore without an enabled administrator.
        '404':
          description: No such user.
  /auth/capabilities:
    get:
      tags:
        - OAuth2
      operationId: getSelfCapabilities
      summary: Get the caller's capabilities
      description: |
        Reports what the calling identity is allowed to do, for callers that cannot
        infer it from other read endpoints. Metastore ownership in particular is not
        exposed anywhere else, which otherwise forces a UI to guess whether an admin
        may perform an action.
      responses:
        '200':
          description: The capabilities were successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfCapabilities'
  /auth/login:
    get:
      tags:
        - OAuth2
      operationId: login
      summary: Start the server-hosted login flow
      description: |
        Redirects the browser to the configured identity provider's authorization endpoint
        (server.authorization-url) with a one-time state bound to a short-lived cookie. The
        identity provider sends the browser back to /auth/callback. Only available when the
        OAuth client properties are configured on the server; the client secret never leaves it.
      parameters:
        - in: query
          name: redirect
          required: false
          description: Path within the UI to return to after login. Must be a relative path.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the identity provider.
        '400':
          description: The hosted login flow is not configured on this server.
  /auth/callback:
    get:
      tags:
        - OAuth2
      operationId: loginCallback
      summary: Complete the server-hosted login flow
      description: |
        Receives the authorization code from the identity provider, exchanges it for an identity
        token using the server-held client secret, verifies that token exactly like the token
        exchange endpoint does, and issues a Unity Catalog access token as the UC_TOKEN cookie
        before redirecting back into the UI.
      parameters:
        - in: query
          name: code
          required: false
          schema:
            type: string
        - in: query
          name: state
          required: false
          schema:
            type: string
        - in: query
          name: error
          required: false
          schema:
            type: string
        - in: query
          name: error_description
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Login succeeded; the UC_TOKEN cookie is set and the browser is sent back to the UI.
        '400':
          description: Missing or mismatched state, an error reported by the identity provider, or an unknown user.
  /auth/providers:
    get:
      tags:
        - OAuth2
      operationId: getAuthProviders
      summary: Which sign-in methods this server offers
      description: |
        Public (no token required). Lets a UI decide at runtime whether sign-in is required at all
        and which entry points to show, so one UI build follows the server's configuration instead
        of baking the choice in.
      responses:
        '200':
          description: The available sign-in methods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviders'
  /auth/admin/login:
    post:
      tags:
        - OAuth2
      operationId: adminLogin
      summary: Sign in as the built-in administrator with a password
      description: |
        Exchanges the administrator password configured on the server (server.admin-password) for
        a Unity Catalog access token, returned in the body and set as the UC_TOKEN cookie. Serves
        the UI's administrator entry point; unavailable unless the password is configured.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Signed in; the UC_TOKEN cookie is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenExchangeInfo'
        '400':
          description: Administrator login is not configured on this server.
        '401':
          description: Wrong username or password.
  /auth/token/login:
    post:
      tags:
        - OAuth2
      operationId: tokenLogin
      summary: Open a browser session with an access token already held
      description: |
        Accepts a Unity Catalog access token issued by this server (the one in etc/conf/token.txt,
        for instance) and sets it as the UC_TOKEN cookie, so an operator can reach the UI with the
        token instead of a password. The token is verified as any request's token is -- signature,
        expiry and an enabled user -- and is handed back unchanged, so the session cannot outlive
        it. Tokens from an identity provider go to /auth/tokens instead.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  format: password
      responses:
        '200':
          description: Signed in; the UC_TOKEN cookie is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenExchangeInfo'
        '400':
          description: No token supplied.
        '401':
          description: The token is not valid for sign-in.
  /auth/tokens:
    post:
      tags:
        - OAuth2
      parameters:
        - in: query
          name: ext
          description: Specifies whether the server will store a token in the user agent's cookie.
          schema:
            $ref: '#/components/schemas/TokenEndpointExtensionType'
          required: false
      operationId: getToken
      summary: Get a token using an OAuth2 flow
      description: |
        Exchanges credentials for a token using the OAuth2 token exchange.
      # NOTE:
      # When specifying `application/x-www-form-urlencoded` as the content type in the OpenAPI schema,
      # the OpenAPI Generator does not generate request models from the schema.
      # Additionally, accessing parameters directly from the body without a model causes issues with
      # Armeria, particularly when the `ext` query parameter is present.
      #
      # To address this, the same request model is defined here and in `components/schemas/OAuthTokenExchangeForm`.
      # These two definitions MUST be identical.
      # The generated model from `components/schemas/OAuthTokenExchangeForm` will be used
      # in both the `controlApi` and `cli` projects.
      #
      # SEE:
      # - https://armeria.dev/docs/server-annotated-service/#getting-a-query-parameter
      # - https://armeria.dev/docs/server-annotated-service/#injecting-a-parameter-as-an-enum-type
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              description: |
                OAuth2 token exchange request form.
                See https://datatracker.ietf.org/doc/html/rfc8693
              type: object
              required:
                - grant_type
                - subject_token
                - subject_token_type
              properties:
                grant_type:
                  $ref: "#/components/schemas/GrantType"
                scope:
                  description: The authorization scope for the token exchange request.
                  type: string
                requested_token_type:
                  $ref: '#/components/schemas/TokenType'
                subject_token:
                  description: The security token that represents the identity of the party on behalf of whom the request is being made.
                  type: string
                subject_token_type:
                  $ref: '#/components/schemas/TokenType'
                actor_token:
                  description: The security token that represents the identity of the acting party.
                  type: string
                actor_token_type:
                  $ref: '#/components/schemas/TokenType'
      responses:
        '200':
          description: The token exchange was successfully granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenExchangeInfo'
  /auth/logout:
    post:
      tags:
        - OAuth2
      operationId: logout
      summary: Revoke access token cookie
      description: |
        Revokes the access token cookie.
      # NOTE:
      # OAS 3.0 allows empty request bodies. In other words:
      #```
      #  requestBody:
      #    content:
      #      application/json: {}
      #```
      # should be permissible. However, due to the limitations of the OpenAPI Generator, which only
      # accepts OAS 2-style notation, this is a workaround.
      # SEE:
      # - https://github.com/OpenAPITools/openapi-generator/blob/v5.1.0/docs/generators/java.md#parameter-feature
      requestBody:
        content:
          application/json:
            schema:
              type: object
              nullable: true
      responses:
        '200':
          description: The access token will be revoked.

components:
  schemas:
    User:
      properties:
        id:
          description: The unique identifier of the user.
          type: string
        name:
          description: The name of the user.
          type: string
        email:
          description: The email address of the user.
          type: string
        external_id:
          description: The external identifier of the user.
          type: string
        state:
          description: The state of the account.
          type: string
          enum:
            - ENABLED
            - DISABLED
        picture_url:
          description: The URL of the user's profile picture.
          type: string
        created_at:
          description: The time the user was created.
          type: integer
          format: int64
        updated_at:
          description: The time the user was last updated.
          type: integer
          format: int64
      type: object
      required:
        - id
        - name
        - email
    UserResourceList:
      description: List of SCIM User resources.
      type: object
      properties:
        totalResults:
          description: The total number of results.
          type: integer
          format: int32
        itemsPerPage:
            description: The number of items per page.
            type: integer
            format: int32
        startIndex:
            description: The index of the first result.
            type: integer
            format: int32
        Resources:
            description: The list of User resources.
            type: array
            items:
                $ref: '#/components/schemas/UserResource'
        id:
            description: User list id metadata.
            type: string
        externalId:
            description: User list external id metadata.
            type: string
        meta:
          description: The metadata of the user.
          type: object
          properties:
            resourceType:
              type: string
            created:
              type: string
            lastModified:
              type: string
    AuthProviders:
      type: object
      properties:
        authorization_enabled:
          type: boolean
          description: Whether requests must carry a token at all (server.authorization).
        hosted_login:
          type: boolean
          description: Whether the server-hosted OAuth sign-in (/auth/login) is configured.
        admin_login:
          type: boolean
          description: Whether the administrator password sign-in (/auth/admin/login) is configured.
    SelfCapabilities:
      type: object
      properties:
        metastore_admin:
          type: boolean
          description: |
            Whether the caller owns the metastore. Metastore owners are authorized for
            every securable, including ones they do not personally own.
    MetastoreAdmins:
      type: object
      properties:
        admins:
          type: array
          description: Principals holding OWNER on the metastore.
          items:
            type: string
    PatchRequest:
      description: |
        A SCIM patch. Only a single `replace` operation with no path is honoured, and its value
        sets the user's `active` flag.
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          example:
            - urn:ietf:params:scim:api:messages:2.0:PatchOp
        Operations:
          type: array
          items:
            $ref: '#/components/schemas/PatchOperation'
    PatchOperation:
      type: object
      properties:
        op:
          type: string
          description: The patch operation; only `replace` is supported.
          example: replace
        path:
          type: string
          description: >
            The attribute to replace. Omit it to send the attributes as an object in `value`
            (the form Okta and this project's UI use); set it to `active` to send the bare value.
            `active` is the only attribute this endpoint changes; anything else is answered with
            501.
          example: active
        value:
          type: object
          description: >
            With no `path`, the object of attributes to replace — RFC 7644 §3.5.2.1 requires an
            object here, not a bare value, and the server's SCIM library enforces that while
            parsing, so a scalar is refused before any handler runs. With `path` set, this is
            instead that attribute's new value (for `active`, a boolean).
          properties:
            active:
              type: boolean
              description: The user's new `active` state.
          example:
            active: false
    OwnedObjectsResponse:
      type: object
      properties:
        principal:
          type: string
          description: The user whose objects these are.
        owned:
          type: array
          description: |
            Every securable this user owns. Empty means the user can be deleted without naming
            anyone to take ownership.
          items:
            $ref: '#/components/schemas/OwnedObject'
    OwnedObject:
      type: object
      properties:
        securable_type:
          type: string
          description: |
            The kind of securable, named as in /permissions/{securable_type}/{full_name}.
          example: table
        full_name:
          type: string
          description: |
            The securable's qualified name. Falls back to the bare name when an ancestor has
            already been deleted — a catalog's removal does not clear what was under it.
          example: sales.raw.orders
        securable_id:
          type: string
          description: The securable's id.
    UserResource:
      description: SCIM provides a resource type for "User" resources.
      type: object
      properties:
        id:
          description: The id of the user.
          type: string
        displayName:
          description: The name of the user.
          type: string
        externalId:
          description: The SCIM external id.
          type: string
        emails:
          description: E-mail addresses for the user.
          type: array
          items:
            $ref: '#/components/schemas/Email'
        active:
            description: The active status of the user.
            type: boolean
        meta:
          description: The metadata of the user.
          type: object
          properties:
            created:
              type: string
            lastModified:
              type: string
        photos:
          description: The photos of the user.
          type: array
          items:
            type: object
            properties:
              value:
                description: The url of the user's photo.
                type: string
    Email:
      description: SCIM email for a user.
      type: object
      properties:
        value:
          description: The email of the user.
          type: string
        primary:
          description: If the email is primary.
          type: boolean
    GrantType:
      description: |
        Grant type identifier, from RFC 8693 Section 2.
        See https://datatracker.ietf.org/doc/html/rfc8693#section-2
      type: string
      enum:
        - urn:ietf:params:oauth:grant-type:token-exchange
      # NOTE:
      # OpenAPI 3.0/2.0 do not have a way to define custom names for enum values,
      # but some tools (e.g., openapi-generator and openapi-typescript) provide
      # x-prefixed extensions for this purpose.
      x-enum-varnames:
        - TOKEN_EXCHANGE
    TokenType:
      description: |
        Token type identifier, from RFC 8693 Section 3.
        See https://datatracker.ietf.org/doc/html/rfc8693#section-3
      type: string
      enum:
        - urn:ietf:params:oauth:token-type:access_token
        - urn:ietf:params:oauth:token-type:refresh_token
        - urn:ietf:params:oauth:token-type:id_token
        - urn:ietf:params:oauth:token-type:saml1
        - urn:ietf:params:oauth:token-type:saml2
        - urn:ietf:params:oauth:token-type:jwt
      # NOTE:
      # OpenAPI 3.0/2.0 do not have a way to define custom names for enum values,
      # but some tools (e.g., openapi-generator and openapi-typescript) provide
      # x-prefixed extensions for this purpose.
      x-enum-varnames:
        - ACCESS_TOKEN
        - REFRESH_TOKEN
        - ID_TOKEN
        - SAML1
        - SAML2
        - JWT
    AccessTokenType:
      description: |
        Access token type identifier, from RFC 8693 Section 2.
        See https://datatracker.ietf.org/doc/html/rfc8693#section-2
      type: string
      enum:
        - Bearer
    ResponseType:
      description: |
        Authorization endpoint response type, from RFC 6749 Section 3.
        See https://datatracker.ietf.org/doc/html/rfc6749#section-3
      type: string
      enum:
        - code
        - token
    AuthorizationGrantType:
      description: |
        Authorization grant type, from RFC 6749 Section 4.
        See https://datatracker.ietf.org/doc/html/rfc6749#section-4
      type: string
      enum:
        - authorization_code
    TokenEndpointExtensionType:
      description: |
        The /auth/tokens endpoint supports an extension type.
        If ext=cookie is specified in the request query, the server will store a token in the user agent's cookie.
      type: string
      enum:
        - cookie
    OAuthTokenExchangeForm:
      description: |
        OAuth2 token exchange request form.
        See https://datatracker.ietf.org/doc/html/rfc8693
      type: object
      required:
        - grant_type
        - subject_token
        - subject_token_type
      properties:
        grant_type:
          $ref: "#/components/schemas/GrantType"
        scope:
          description: The authorization scope for the token exchange request.
          type: string
        requested_token_type:
          $ref: '#/components/schemas/TokenType'
        subject_token:
          description: The security token that represents the identity of the party on behalf of whom the request is being made.
          type: string
        subject_token_type:
          $ref: '#/components/schemas/TokenType'
        actor_token:
          description: The security token that represents the identity of the acting party.
          type: string
        actor_token_type:
          $ref: '#/components/schemas/TokenType'
    OAuthTokenExchangeInfo:
      description: |
        OAuth2 token exchange response.
        See https://datatracker.ietf.org/doc/html/rfc8693
      type: object
      required:
        - access_token
        - issued_token_type
        - token_type
      properties:
        access_token:
          description: The access token for the token exchange request.
          type: string
        issued_token_type:
          $ref: '#/components/schemas/TokenType'
        token_type:
          $ref: '#/components/schemas/AccessTokenType'
        expires_in:
          description: The lifetime of the access token in seconds for the token exchange.
          type: integer
          format: int64
        scope:
          description: The authorization scope for the token exchange.
          type: string
        refresh_token:
          description: The refresh token for the token exchange.
          type: string
    OAuthAuthorizationForm:
      description: |
        OAuth2 authorization request form.
        See https://datatracker.ietf.org/doc/html/rfc6749
      type: object
      required:
        - response_type
        - client_id
      properties:
        response_type:
          $ref: '#/components/schemas/ResponseType'
        client_id:
          description: The client identifier that represents the registration information provided by the client
          type: string
        redirect_uri:
          description: The URI that authorization server directs the resource owner's user-agent back to the client.
          type: string
        scope:
          description: The scope of the access request.
          type: string
        state:
          description: An opaque value used by the client to maintain state between the request and callback.
          type: string
    OAuthAuthorizationInfo:
      description: |
        OAuth2 authorization request.
        See https://datatracker.ietf.org/doc/html/rfc6749
      type: object
      required:
        - code
      properties:
        code:
          description: The authorization code generated by the authorization server.
          type: string
        state:
          description: An opaque value used by the client to maintain state between the request and callback.
          type: string
    OAuthAccessTokenForm:
      description: |
        OAuth2 access token request.
        See https://datatracker.ietf.org/doc/html/rfc6749
      type: object
      required:
        - grant_type
        - code
      properties:
        grant_type:
          $ref: "#/components/schemas/AuthorizationGrantType"
        code:
          description: The authorization code received from the authorization server.
          type: string
        redirect_uri:
          description: The URI that authorization server directs the resource owner's user-agent back to the client.
          type: string
        client_id:
          description: The client identifier that represents the registration information provided by the client
          type: string

