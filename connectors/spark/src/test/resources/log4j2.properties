# Test logging for the Spark connector.
#
# Spark logs at INFO to stderr, which sbt tags [error]. In a passing CI job that
# produced 226,580 of 240,773 log lines, so a real failure was unfindable and the
# log archive ran to ~49MB. Keep the framework at WARN and Unity Catalog's own
# loggers at INFO, so test diagnostics survive.

rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = stderr

appender.stderr.type = Console
appender.stderr.name = stderr
appender.stderr.target = SYSTEM_ERR
appender.stderr.layout.type = PatternLayout
appender.stderr.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

logger.unitycatalog.name = io.unitycatalog
logger.unitycatalog.level = info
